
[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 16

[browser]
gatherUsageStats = false

[theme]
base = "dark"
font = "'Segoe UI Variable', 'Aptos', 'Segoe UI', sans-serif"
headingFont = "'Segoe UI Variable Display', 'Aptos Display', 'Segoe UI', sans-serif"
codeFont = "'Cascadia Code', 'Consolas', monospace"
baseFontSize = 15
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
chartCategoricalColors = ["#00D6C3", "#947AFF", "#FFAD4E", "#FF5473", "#4AA8FF"]

[theme.dark]
primaryColor = "#00D6C3"
backgroundColor = "#0B1019"
secondaryBackgroundColor = "#151B29"
textColor = "#F2F7FF"
borderColor = "#2A3549"
dataframeHeaderBackgroundColor = "#202A3C"

[theme.dark.sidebar]
backgroundColor = "#121723"
secondaryBackgroundColor = "#1B2333"
textColor = "#F2F7FF"

[theme.light]
primaryColor = "#007F85"
backgroundColor = "#EFF4FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16263B"
borderColor = "#D8E3EF"
dataframeHeaderBackgroundColor = "#E8EFF8"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F8FF"
textColor = "#16263B"
